name: Circulair CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: circulair-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application tests and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"
      NODE_ENV: test
      JWT_SECRET: isolated-ci-signing-key-never-use-in-production
      VITE_ACCESS_USERNAME: isolated-ci-fixture
      VITE_ACCESS_PASSWORD: not-a-production-credential
      DATABASE_URL: ""
      RENDER_DATABASE_URL: ""
      OPENAI_API_KEY: ""
      STRIPE_SECRET_KEY: ""
      STRIPE_WEBHOOK_SECRET: ""
      PAGERDUTY_ENABLED: "false"
      PAGERDUTY_ROUTING_KEY: ""
      OPEN_SOURCE_ALERTING_ENABLED: "false"
      INCIDENT_OUTBOX_ENABLED: "false"
      LOCAL_PILOT_ENABLED: "false"
      ENABLE_MQTT: "false"
      MQTT_ENABLED: "false"
      MQTT_BROKER_URL: ""
      SMTP_HOST: ""
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
    steps:
      - name: Check out the tested commit without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the observed Render Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.14.1"
          package-manager-cache: false
      - name: Install the reviewed frozen dependency graph
        run: npx --yes pnpm@10.34.5 install --frozen-lockfile
      - name: Run all offline application regression tests
        run: npx --yes pnpm@10.34.5 exec vitest run --maxWorkers=1 --minWorkers=1
      - name: Check TypeScript
        run: npx --yes pnpm@10.34.5 run check
      - name: Build without inherited frontend or provider secrets
        run: env -i PATH="$PATH" HOME="$HOME" NODE_ENV=production npx --yes pnpm@10.34.5 run build
      - name: Verify real disabled worker startup and activation denials
        run: python3 -B scripts/incident-worker-startup-qa.py
      - name: Compile gateway Python sources without contacting hardware
        run: python3 -m compileall -q gateway/python-agent
      - name: Install the exact offline gateway test HTTP library
        run: python3 -m pip install requests==2.34.2
      - name: Run finite offline gateway validation and transport tests
        run: python3 -B -m unittest discover -s gateway/python-agent -p 'test*.py' -v

  monitoring:
    name: Monitoring deployment structure
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the tested commit without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check shell entrypoint syntax
        run: |
          find infra/monitoring -name '*.sh' -type f -print0 | xargs -0 -r -n 1 sh -n
      - name: Compile monitoring validation sources
        run: python3 -m compileall -q infra/monitoring
      - name: Install pinned monitoring validation dependencies
        run: python3 -m pip install -r infra/monitoring/tools/requirements-ci.txt
      - name: Download checksum-verified official test binaries
        run: python3 infra/monitoring/tools/download_test_binaries.py /tmp/monitoring-bin
      - name: Run native configuration and loopback ingress tests
        run: MONITORING_BIN_DIR=/tmp/monitoring-bin python3 infra/monitoring/test_monitoring.py

name: Circulair CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: circulair-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application tests and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"
      NODE_ENV: test
      JWT_SECRET: isolated-ci-signing-key-never-use-in-production
      VITE_ACCESS_USERNAME: isolated-ci-fixture
      VITE_ACCESS_PASSWORD: not-a-production-credential
      DATABASE_URL: ""
      RENDER_DATABASE_URL: ""
      OPENAI_API_KEY: ""
      ZEPTOMAIL_TOKEN: ""
      FROM_EMAIL: ""
      OWNER_EMAIL: ""
      STRIPE_SECRET_KEY: ""
      STRIPE_WEBHOOK_SECRET: ""
      CASHFREE_SANDBOX_ENABLED: "false"
      CASHFREE_MODE: "sandbox"
      CASHFREE_TEST_CLIENT_ID: ""
      CASHFREE_TEST_CLIENT_SECRET: ""
      CASHFREE_SANDBOX_ALLOWED_USER_IDS: ""
      PAGERDUTY_ENABLED: "false"
      PAGERDUTY_ROUTING_KEY: ""
      OPEN_SOURCE_ALERTING_ENABLED: "false"
      INCIDENT_OUTBOX_ENABLED: "false"
      LOCAL_PILOT_ENABLED: "false"
      ENABLE_MQTT: "false"
      MQTT_ENABLED: "false"
      MQTT_BROKER_URL: ""
      SMTP_HOST: ""
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
    steps:
      - name: Check out the tested commit without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the observed Render Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.14.1"
          package-manager-cache: false
      - name: Install the reviewed frozen dependency graph
        run: npx --yes pnpm@10.34.5 install --frozen-lockfile
      - name: Run all offline application regression tests
        run: npx --yes pnpm@10.34.5 exec vitest run --maxWorkers=1 --minWorkers=1
      - name: Verify atomic password recovery on a fresh Unix-socket-only PostgreSQL cluster
        run: python3 -B scripts/password-recovery-qa.py --output /tmp/password-recovery-evidence
      - name: Verify outbox QA fails on skipped or incomplete assertions
        run: python3 -B scripts/test_incident_outbox_qa.py
      - name: Verify all 28 PostgreSQL outbox cases in a fresh network-isolated cluster
        id: outbox-postgres
        run: python3 -B scripts/incident-outbox-qa.py --output /tmp/incident-outbox-evidence
      - name: Save sanitized outbox QA evidence even after failure
        if: always() && steps.outbox-postgres.outcome != 'skipped'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: incident-outbox-qa-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            /tmp/incident-outbox-evidence/result.json
            /tmp/incident-outbox-evidence/guarded-cases.json
            /tmp/incident-outbox-evidence/vitest.json
            /tmp/incident-outbox-evidence/tests.log
            /tmp/incident-outbox-evidence/base-schema.sql
            /tmp/incident-outbox-evidence/initdb.log
            /tmp/incident-outbox-evidence/startup.log
            /tmp/incident-outbox-evidence/database.log
            /tmp/incident-outbox-evidence/schema.log
            /tmp/incident-outbox-evidence/shutdown.log
            /tmp/incident-outbox-evidence/shutdown-immediate.log
      - name: Check TypeScript
        run: npx --yes pnpm@10.34.5 run check
      - name: Build without inherited frontend or provider secrets
        run: env -i PATH="$PATH" HOME="$HOME" NODE_ENV=production npx --yes pnpm@10.34.5 run build
      - name: Verify real disabled worker startup and activation denials
        run: python3 -B scripts/incident-worker-startup-qa.py
      - name: Compile gateway Python sources without contacting hardware
        run: python3 -m compileall -q gateway/python-agent
      - name: Install the exact offline gateway test HTTP library
        run: python3 -m pip install requests==2.34.2
      - name: Run finite offline gateway validation and transport tests
        run: python3 -B -m unittest discover -s gateway/python-agent -p 'test*.py' -v

  monitoring:
    name: Monitoring deployment structure
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the tested commit without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check shell entrypoint syntax
        run: |
          find infra/monitoring -name '*.sh' -type f -print0 | xargs -0 -r -n 1 sh -n
      - name: Compile monitoring validation sources
        run: python3 -m compileall -q infra/monitoring
      - name: Install pinned monitoring validation dependencies
        run: python3 -m pip install -r infra/monitoring/tools/requirements-ci.txt
      - name: Download checksum-verified official test binaries
        run: python3 infra/monitoring/tools/download_test_binaries.py /tmp/monitoring-bin
      - name: Build the pinned SMTP-repaired native source and run Go transport regression
        run: |
          env -i PATH="$PATH" HOME="$HOME" sh infra/monitoring/alertmanager/build-native.sh /tmp/smtp-native-build
          cp /tmp/smtp-native-build/bin/alertmanager /tmp/monitoring-bin/alertmanager
          cp /tmp/smtp-native-build/bin/amtool /tmp/monitoring-bin/amtool
      - name: Run native configuration and loopback ingress tests
        run: MONITORING_BIN_DIR=/tmp/monitoring-bin python3 infra/monitoring/test_monitoring.py
      - name: Run guarded native email TLS and secret-file tests
        run: MONITORING_BIN_DIR=/tmp/monitoring-bin python3 infra/monitoring/test_email_delivery.py
      - name: Run actual SMTP EOF, one-minute recovery, acknowledgement and shutdown tests
        run: MONITORING_BIN_DIR=/tmp/monitoring-bin SMTP_EVIDENCE_DIR=/tmp/smtp-native-evidence python3 infra/monitoring/test_smtp_reliability.py

  kuma-smtp:
    name: Pinned Kuma SMTP regression and image guard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the tested commit without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run native and repaired DOWN, UP and TEST email against loopback TLS only
        run: python3 -B infra/monitoring/tools/kuma_smtp_qa.py --output /tmp/kuma-smtp-evidence
      - name: Build the existing Kuma service with checksum-guarded SMTP repair
        run: docker build --platform linux/amd64 -t circulair-kuma-smtp-qa -f infra/monitoring/kuma/Dockerfile infra/monitoring
      - name: Verify actual nonroot image integrity without bootstrapping monitors
        run: |
          docker run --rm --network none --entrypoint node circulair-kuma-smtp-qa /opt/monitoring/patch-smtp.cjs --check
          docker run --rm --network none --entrypoint sh circulair-kuma-smtp-qa -c 'test "$(id -u)" = 1000 && test ! -u /usr/bin/sudo && test -z "$(getcap /usr/local/bin/caddy)"'

  alertmanager-image:
    name: Source-repaired Alertmanager image runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the tested commit without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the exact pinned source image and native Go regression
        run: docker build --platform linux/amd64 -t circulair-alertmanager-smtp-qa -f infra/monitoring/alertmanager/Dockerfile infra/monitoring
      - name: Check actual image user, granted capabilities and native config without runtime user overrides
        run: |
          docker run --rm --network none --entrypoint /bin/sh circulair-alertmanager-smtp-qa -c 'set -eu; test "$(id -u)" = 65534; test "$(id -g)" = 65534; test -w /alertmanager; for cap in CapPrm CapEff CapInh CapAmb; do grep -Eq "^${cap}:[[:space:]]+0+$" /proc/1/status; done; /bin/amtool check-config /etc/alertmanager/alertmanager.yml; /bin/alertmanager --version'
      - name: Verify actual default-OFF image startup and readiness with no external network
        run: |
          set -eu
          name="smtp-off-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          docker run -d --network none --name "$name" circulair-alertmanager-smtp-qa
          for attempt in $(seq 1 30); do
            if docker exec "$name" /bin/wget -q -O - http://127.0.0.1:9093/-/ready; then exit 0; fi
            sleep 1
          done
          exit 1
